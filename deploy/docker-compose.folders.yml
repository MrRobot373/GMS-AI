# Let Work AI / Super AI tasks work directly in a folder of the host (docs/06-work-ai.md, "Working in a folder").
# Set WORK_FOLDERS_HOST in .env to the folder on the host (for example /srv/projects); it appears as /projects in the
# api container, and that is the folder tasks may use. Start with:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.folders.yml up -d
services:
  api:
    environment:
      WORK_FOLDERS: /projects
    volumes:
      - ${WORK_FOLDERS_HOST:?set WORK_FOLDERS_HOST to the folder on this host}:/projects
