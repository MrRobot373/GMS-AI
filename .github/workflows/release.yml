# A release (docs/13-releases.md): for a tag like v1.0.0 made by scripts/release.mjs, or by hand
# (Actions → Release → Run workflow) to try everything without publishing.
#  1. The tag must match VERSION, and CHANGELOG.md must have the version's section (the notes).
#  2. Builds the API and web images for that version.
#  3. Upgrade test: the previous release's API image makes data, this one must keep all of it and
#     work (tests/e2e/run-upgrade.sh). The first release checks a restart onto the same data.
#  4. Publishing (tags, or "publish" ticked): pushes the images to the GitHub container registry
#     as <version>, <major>.<minor> and latest (not for pre-releases like 1.1.0-rc.1), and creates
#     the GitHub release with the notes and the deploy folder set to this version.
# The desktop packages are attached to the same release by .github/workflows/desktop.yml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the images and create the GitHub release
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}

env:
  PG: postgres://aatmiq:aatmiq@localhost:5432

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: aatmiq, POSTGRES_PASSWORD: aatmiq }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aatmiq" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - name: Room for the images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version and notes
        id: v
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but VERSION says $VERSION (cut releases with scripts/release.mjs)"; exit 1
          fi
          # The version's section of CHANGELOG.md, without its heading.
          awk -v v="$VERSION" '$0 ~ "^## "v" — " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          PUBLISH=false
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "${{ inputs.publish }}" = true ]; then PUBLISH=true; fi
          PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/"
          case "$VERSION" in *-*) PRE=true ;; *) PRE=false ;; esac
          { echo "version=$VERSION"; echo "publish=$PUBLISH"; echo "prefix=$PREFIX"; echo "pre=$PRE"; echo "minor=${VERSION%.*}"; } >> "$GITHUB_OUTPUT"
          echo "Aatmiq $VERSION (publish: $PUBLISH, pre-release: $PRE)"; cat notes.md
      - name: Build the images
        run: |
          docker build -f deploy/Dockerfile.api -t "${{ steps.v.outputs.prefix }}aatmiq-api:${{ steps.v.outputs.version }}" .
          docker build -f deploy/Dockerfile.web -t "${{ steps.v.outputs.prefix }}aatmiq-web:${{ steps.v.outputs.version }}" .
      - name: Upgrade test from the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW="${{ steps.v.outputs.prefix }}aatmiq-api:${{ steps.v.outputs.version }}"
          PREV="$(gh release list --exclude-drafts --limit 30 --json tagName --jq '[.[].tagName | select(. != "v${{ steps.v.outputs.version }}")][0] // ""')"
          if [ -n "$PREV" ] && docker pull "${{ steps.v.outputs.prefix }}aatmiq-api:${PREV#v}"; then
            FROM="${{ steps.v.outputs.prefix }}aatmiq-api:${PREV#v}"
          else
            echo "No earlier release to upgrade from: checking a restart onto the same data instead."
            FROM="$NEW"
          fi
          FROM_IMAGE="$FROM" TO_IMAGE="$NEW" TO_VERSION="${{ steps.v.outputs.version }}" tests/e2e/run-upgrade.sh
      - name: Push the images
        if: steps.v.outputs.publish == 'true'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for name in aatmiq-api aatmiq-web; do
            src="${{ steps.v.outputs.prefix }}$name:${{ steps.v.outputs.version }}"
            docker push "$src"
            if [ "${{ steps.v.outputs.pre }}" = false ]; then
              for tag in "${{ steps.v.outputs.minor }}" latest; do
                docker tag "$src" "${{ steps.v.outputs.prefix }}$name:$tag" && docker push "${{ steps.v.outputs.prefix }}$name:$tag"
              done
            fi
          done
      - name: The deploy folder for this version
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p "dist/aatmiq-$V"
          cp -r deploy "dist/aatmiq-$V/deploy"
          # Our own license server isn't part of what customers run.
          rm -rf "dist/aatmiq-$V/deploy/license"
          cp VERSION CHANGELOG.md "dist/aatmiq-$V/"
          printf '%s\n' "Aatmiq $V" "" \
            "Install or update: docs at https://github.com/$GITHUB_REPOSITORY/blob/v$V/docs/13-releases.md" "" \
            "  cp deploy/.env.example deploy/.env    # new install: then edit it (it already names this release's images)" \
            "  deploy/team.sh pull                   # this release's images" \
            "  deploy/team.sh up -d                  # start, or update in place (no --build: there's no source here)" \
            > "dist/aatmiq-$V/README.txt"
          # The release's images instead of building from the source.
          sed -i "s#^AATMIQ_IMAGE_PREFIX=.*#AATMIQ_IMAGE_PREFIX=${{ steps.v.outputs.prefix }}#; s#^AATMIQ_VERSION=.*#AATMIQ_VERSION=$V#" "dist/aatmiq-$V/deploy/.env.example"
          tar -czf "dist/aatmiq-deploy-$V.tar.gz" -C dist "aatmiq-$V"
          ls -la dist
      - name: Create the GitHub release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          # The desktop workflow may have made it first.
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "Aatmiq $V" --notes-file notes.md \
            $([ "${{ steps.v.outputs.pre }}" = true ] && echo --prerelease) || gh release view "v$V" >/dev/null
          gh release upload "v$V" "dist/aatmiq-deploy-$V.tar.gz" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: aatmiq-deploy-${{ steps.v.outputs.version }}
          path: dist/aatmiq-deploy-*.tar.gz
